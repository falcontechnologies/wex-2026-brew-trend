<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homebrew Analytics — Pipeline Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://brew.sh/assets/img/homebrew.svg">
</head>
<body>
    <div class="container">
        <header>
            <h1>Homebrew Analytics</h1>
            <p class="subtitle">Pipeline Status & Trends</p>
        </header>

        <main>
            <section class="chart-section">
                <h2>Analytics Trends</h2>
                <div class="card">
                    <img id="main-chart" src="images/homebrew_analytics.png" alt="Homebrew Analytics Chart">
                    <p class="card-caption">Generated daily via plot_analytics.py</p>
                </div>
            </section>

            <section class="health-section">
                <h2>Pipeline Health</h2>
                <div id="health-status" class="card">
                    <div class="loading">Loading health data...</div>
                </div>
            </section>
        </main>

        <footer>
            <p id="last-updated">Checking for updates...</p>
        </footer>
    </div>

    <script>
        async function loadHealth() {
            try {
                const response = await fetch('data/health.json');
                const data = await response.json();
                const healthDiv = document.getElementById('health-status');
                const updatedPara = document.getElementById('last-updated');

                const sched = data.scheduler;
                const db = data.database;
                const logs = data.logs;

                let html = `
                    <div class="health-grid">
                        <div class="health-item">
                            <h3>Scheduler</h3>
                            <p class="status ${sched.registered ? 'ok' : 'error'}">
                                ${sched.registered ? '✔ Registered' : '✘ Not Found'}
                            </p>
                            <p><strong>Next Run:</strong> ${sched.next_run || 'N/A'}</p>
                            <p><strong>Status:</strong> ${sched.status || 'Unknown'}</p>
                        </div>
                        <div class="health-item">
                            <h3>Database</h3>
                            <p class="status ${db.exists ? 'ok' : 'error'}">
                                ${db.exists ? '✔ Found' : '✘ Missing'}
                            </p>
                            <p><strong>Snapshots:</strong> ${db.snapshots}</p>
                            <p><strong>Latest Date:</strong> ${db.last_date || 'N/A'}</p>
                        </div>
                        <div class="health-item">
                            <h3>Logs</h3>
                            <p class="status ${logs.log_exists ? 'ok' : 'warn'}">
                                ${logs.log_exists ? '✔ Active' : '⚠ Missing'}
                            </p>
                            <p><strong>Run Files:</strong> ${logs.run_files}</p>
                            <p><strong>Errors:</strong> ${logs.recent_errors.length}</p>
                        </div>
                    </div>
                `;
                healthDiv.innerHTML = html;
                
                const updateTime = new Date(data.updated_at).toLocaleString();
                updatedPara.innerText = `Pipeline Dashboard — Last Updated: ${updateTime}`;
            } catch (error) {
                console.error('Error loading health data:', error);
                document.getElementById('health-status').innerHTML = '<p class="error">Failed to load health data.</p>';
            }
        }

        loadHealth();
    </script>
</body>
</html>
